    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Tom Select 樣式（支援搜尋功能的下拉選單） -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- 標題區 -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2 flex items-center justify-center gap-3">
                <i class="fa-solid fa-music text-indigo-600"></i> 1A班 學生樂器訓練名單
            </h1>
            <p class="text-slate-500">總學生人數：<span id="total-count" class="font-semibold text-slate-700">0</span> 人</p>
        </header>

        <!-- 統計卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="text-sm text-slate-400 font-medium">總人數</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-slate-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-drum"></i>
                </div>
                <div>
                    <p class="text-sm text-slate-400 font-medium">樂器種類</p>
                    <h3 id="stat-instruments" class="text-2xl font-bold text-slate-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div>
                    <p class="text-sm text-slate-400 font-medium">上課時段組合</p>
                    <h3 id="stat-times" class="text-2xl font-bold text-slate-800">0</h3>
                </div>
            </div>
        </div>

        <!-- 搜尋與篩選控制區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8 flex flex-col lg:flex-row gap-4 justify-between items-center">
            
            <!-- 下拉選擇學生姓名 -->
            <div class="w-full lg:w-1/3">
                <select id="student-select" placeholder="請選擇或搜尋學生姓名...">
                    <option value="">全部學生 (All Students)</option>
                </select>
            </div>
            
            <div class="w-full lg:w-2/3 flex flex-col sm:flex-row gap-4 justify-end">
                <select id="instrument-filter" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="">所有樂器 (All Instruments)</option>
                </select>
                <select id="time-filter" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="">所有上課時間 (All Times)</option>
                </select>
                <button id="reset-btn" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-xl text-sm transition-colors whitespace-nowrap">
                    重設篩選
                </button>
            </div>
        </div>

        <!-- 表格區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/75 border-b border-slate-100 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-4 px-6 font-semibold">ID</th>
                            <th class="py-4 px-6 font-semibold">班別</th>
                            <th class="py-4 px-6 font-semibold">姓名</th>
                            <th class="py-4 px-6 font-semibold">樂器</th>
                            <th class="py-4 px-6 font-semibold">上課時間</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- 動態生成內容 -->
                    </tbody>
                </table>
            </div>
            <!-- 無資料提示 -->
            <div id="no-data" class="hidden py-12 text-center text-slate-400">
                <i class="fa-solid fa-face-frown text-3xl mb-2"></i>
                <p>找不到符合條件的學生資料</p>
            </div>
        </div>
    </div>

        const tableBody = document.getElementById('student-table-body');
        const instrumentFilter = document.getElementById('instrument-filter');
        const timeFilter = document.getElementById('time-filter');
        const resetBtn = document.getElementById('reset-btn');
        const noData = document.getElementById('no-data');
        const totalCountSpan = document.getElementById('total-count');
        
        const statTotal = document.getElementById('stat-total');
        const statInstruments = document.getElementById('stat-instruments');
        const statTimes = document.getElementById('stat-times');

        let studentSelectInstance = null;

        // 初始化所有下拉選單
        function initFilters() {
            const studentSelect = document.getElementById('student-select');
            students.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.name} (ID: ${s.id})`;
                studentSelect.appendChild(opt);
            });

            // 啟用 Tom Select 讓姓名欄位變成可搜尋的下拉選單
            studentSelectInstance = new TomSelect('#student-select', {
                create: false,
                sortField: { field: "text", direction: "asc" },
                placeholder: "請選擇或搜尋學生姓名..."
            });

            const instruments = [...new Set(students.map(s => s.instrument))].sort();
            const times = [...new Set(students.map(s => s.time))].sort();

            instruments.forEach(inst => {
                const opt = document.createElement('option');
                opt.value = inst;
                opt.textContent = inst;
                instrumentFilter.appendChild(opt);
            });

            times.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                timeFilter.appendChild(opt);
            });

            // 更新統計卡片
            statTotal.textContent = students.length;
            statInstruments.textContent = instruments.length;
            statTimes.textContent = times.length;
            totalCountSpan.textContent = students.length;
        }

        // 渲染表格資料
        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                noData.classList.remove('hidden');
                return;
            }
            noData.classList.add('hidden');

            data.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50/50 transition-colors' : 'bg-slate-50/30 hover:bg-slate-50/50 transition-colors';
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-mono text-slate-500">${student.id}</td>
                    <td class="py-3.5 px-6"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-semibold">${student.class}</span></td>
                    <td class="py-3.5 px-6 font-medium text-slate-900">${student.name}</td>
                    <td class="py-3.5 px-6"><span class="text-slate-700 font-medium">${student.instrument}</span></td>
                    <td class="py-3.5 px-6 text-slate-500 text-xs">${student.time}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 過濾邏輯
        function filterData() {
            const selectedStudentId = document.getElementById('student-select').value;
            const selectedInst = instrumentFilter.value;
            const selectedTime = timeFilter.value;

            const filtered = students.filter(student => {
                const matchStudent = selectedStudentId === '' || student.id.toString() === selectedStudentId;
                const matchInst = selectedInst === '' || student.instrument === selectedInst;
                const matchTime = selectedTime === '' || student.time === selectedTime;
                return matchStudent && matchInst && matchTime;
            });

            renderTable(filtered);
            totalCountSpan.textContent = filtered.length;
        }

        // 事件監聽
        document.getElementById('student-select').addEventListener('change', filterData);
        instrumentFilter.addEventListener('change', filterData);
        timeFilter.addEventListener('change', filterData);

        resetBtn.addEventListener('click', () => {
            if (studentSelectInstance) {
                studentSelectInstance.clear();
            }
            instrumentFilter.value = '';
            timeFilter.value = '';
            filterData();
        });

        // 初始化執行
        initFilters();
        renderTable(students);
    </script>
